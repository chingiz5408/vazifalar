# ==========================================================================
# nginx — Sputnik Academy
# Joy: /etc/nginx/sites-available/sputnik   (keyin: ln -s ... sites-enabled/)
#
# Barcha trafik nginx orqali o'tadi:
#   /static/  -> collectstatic natijasi (tez, to'g'ridan-to'g'ri)
#   /media/   -> yuklangan PDF, preview, rasm (to'g'ridan-to'g'ri)
#   qolganlari -> gunicorn (127.0.0.1:8000)
# ==========================================================================

upstream sputnik_django {
    server 127.0.0.1:8000 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    # Hozircha faqat IP bilan. Domen olsangiz shu yerga yozing:
    #   server_name sputnik.uz www.sputnik.uz;
    server_name 185.139.138.150;

    # Yosh o'lchami (admin'dan PDF yuklash uchun): 25 MB
    client_max_body_size 25M;

    # --- Static fayllar (collectstatic) ---
    location /static/ {
        alias /home/admin/loyha/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # --- Media fayllar (PDF, preview, rasm) ---
    location /media/ {
        alias /home/admin/loyha/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # --- Django (gunicorn) ---
    location / {
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Muhim: aynan shu header Django'ga "sayt https da" deganini aytadi.
        # Aks holda SECURE_SSL_REDIRECT cheksiz redirectga olib keladi.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect     off;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_pass http://sputnik_django;
    }

    # --- Xavfsizlik sarlavhalari ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
