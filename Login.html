<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Kirish · Sputnik Academy</title>
  <link rel="stylesheet" href="Hisob.css">
</head>
<body class="login-page">
  <header class="topbar">
    <a class="brand" href="Kirish.html" aria-label="Sputnik Academy bosh sahifasi">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <span>Sputnik Academy</span>
    </a>
    <a class="back-link" href="Kirish.html">Bosh sahifaga</a>
  </header>

  <main class="auth-layout">
    <section class="auth-intro" aria-labelledby="page-title">
      <p class="eyebrow">SPUTNIK ACADEMY · BACKEND DASTURLASH</p>
      <h1 id="page-title">Topshiriqlarni <span>davom ettiring.</span></h1>
      <p class="intro-copy">Amaliy vazifalar va kod muharrirlariga kirish uchun hisobingizga kiring.</p>
      <div class="progress-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="auth-panel" aria-labelledby="form-title">
      <div class="panel-heading">
        <p class="eyebrow">XUSH KELIBSIZ</p>
        <h2 id="form-title">Hisobga kirish</h2>
        <p class="panel-copy">Hisob ma’lumotlaringizni kiriting.</p>
      </div>
      <form id="auth-form" data-mode="login">
        <label for="email">Elektron pochta</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="siz@example.com" required>

        <label for="password">Parol</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Parolingizni kiriting" required>

        <button class="submit-button" type="submit">Kirish <span aria-hidden="true">→</span></button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="switch-page">Hisobingiz yo‘qmi? <a href="Register.html">Ro‘yxatdan o‘ting</a></p>
    </section>
  </main>

  <script src="Hisob.js"></script>
</body>
</html>
