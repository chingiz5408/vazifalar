<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Ro‘yxatdan o‘tish · Sputnik Academy</title>
  <link rel="stylesheet" href="Hisob.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="Kirish.html" aria-label="Sputnik Academy bosh sahifasi">
      <span class="brand-mark" aria-hidden="true">&lt;/&gt;</span>
      <span>Sputnik Academy</span>
    </a>
    <a class="back-link" href="Kirish.html">Bosh sahifaga</a>
  </header>

  <main class="auth-layout register-layout">
    <section class="auth-intro" aria-labelledby="page-title">
      <p class="eyebrow">SPUTNIK ACADEMY · BACKEND DASTURLASH</p>
      <h1 id="page-title">Topshiriqlar ustida <span>ishlashni boshlang.</span></h1>
      <p class="intro-copy">Akademiya topshiriqlar platformasi uchun hisob yarating.</p>
      <div class="progress-mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    </section>

    <section class="auth-panel" aria-labelledby="form-title">
      <div class="panel-heading">
        <p class="eyebrow">YANGI HISOB</p>
        <h2 id="form-title">Ro‘yxatdan o‘tish</h2>
        <p class="panel-copy">Boshlash uchun ma’lumotlaringizni kiriting.</p>
      </div>
      <form id="auth-form" data-mode="register">
        <label for="name">Ism</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Ismingiz" required>

        <label for="email">Elektron pochta</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="siz@example.com" required>

        <label for="password">Parol</label>
        <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="Kamida 8 ta belgi" required>

        <label for="password-confirm">Parolni takrorlang</label>
        <input id="password-confirm" name="password-confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Parolni qayta kiriting" required>

        <button class="submit-button" type="submit">Hisob yaratish <span aria-hidden="true">→</span></button>
        <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
      <p class="switch-page">Hisobingiz bormi? <a href="Login.html">Kirish</a></p>
    </section>
  </main>

  <script src="Hisob.js"></script>
</body>
</html>
